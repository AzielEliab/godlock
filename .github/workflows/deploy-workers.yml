name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Primary deploy is Cursor/wrangler OAuth (identity: Aziel Eliab).
# GitHub Actions is backup only when CLOUDFLARE_API_TOKEN is set.
# Jobs always run. Do not put secrets in job-level if: (invalid on GitHub —
# workflow file issue, 0s failure emails). Gate steps on env.HAS_CF_TOKEN.
# Do not invent or commit tokens.
# Cloudflare account id is public in wrangler.toml for both Workers.

jobs:
  godlock-uk:
    name: Deploy godlock-uk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: workers/godlock-uk
    steps:
      - name: skip-notice
        if: env.HAS_CF_TOKEN == ''
        working-directory: .
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
          exit 0
      - uses: actions/checkout@v4
        if: env.HAS_CF_TOKEN != ''
      - name: Deploy godlock-uk
        if: env.HAS_CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ac575a9b822bea2bed97d0ab73aed238
          workingDirectory: workers/godlock-uk
          command: deploy --keep-vars

  download-tracker:
    name: Deploy download-tracker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: workers/download-tracker
    steps:
      - name: skip-notice
        if: env.HAS_CF_TOKEN == ''
        working-directory: .
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
          exit 0
      - uses: actions/checkout@v4
        if: env.HAS_CF_TOKEN != ''
      - name: Deploy download-tracker
        if: env.HAS_CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ac575a9b822bea2bed97d0ab73aed238
          workingDirectory: workers/download-tracker
          command: deploy
