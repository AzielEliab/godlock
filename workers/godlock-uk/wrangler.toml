name = "godlock-uk"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Do not put usernames, passwords, or hashes in this file.

[ai]
binding = "AI"

# Same-account FragGate door (library uses the same binding). HTTPS origin is the fallback.
[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"

[[d1_databases]]
binding = "DB"
database_name = "godlock-uk"
database_id = "a499ef56-ad02-4431-a3e4-e23f96f500f0"

# Reuse the download-tracker DOWNLOADS namespace. Keys are prefixed runtime_uses|
# so download stats (project|owner|repo|branch|fork) stay isolated.
[[kv_namespaces]]
binding = "RUNTIME_USES"
id = "39527eecfc294ddd86af99c806baaa45"

# Zone godlock.uk is not in this Cloudflare account (API 10082).
# Apex https://godlock.uk is proxied to this origin separately.
# [[routes]]
# pattern = "godlock.uk"
# custom_domain = true
# [[routes]]
# pattern = "www.godlock.uk"
# custom_domain = true
